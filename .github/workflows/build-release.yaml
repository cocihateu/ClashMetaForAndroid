name: Build Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release Tag (v2.x.x)'
        required: true

jobs:
  BuildRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Apply Mihomo Fallback Enhancement
        run: |
          git -C core/src/foss/golang/clash apply --check "$GITHUB_WORKSPACE/.github/mihomo-patch/enhance-fallback.patch"
          git -C core/src/foss/golang/clash apply "$GITHUB_WORKSPACE/.github/mihomo-patch/enhance-fallback.patch"

      - name: Configure Custom Application ID
        run: echo "custom.application.id=com.cocihateu.clash" >> local.properties

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify Mihomo Fallback Patch
        working-directory: core/src/foss/golang/clash
        run: |
          go vet ./adapter/outboundgroup/...
          go test -v ./adapter/outboundgroup -run TestFallback
      
      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Signing properties
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is required for release builds"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "keystore.password=$SIGNING_STORE_PASSWORD"
            echo "key.alias=$SIGNING_KEY_ALIAS"
            echo "key.password=$SIGNING_KEY_PASSWORD"
          } > signing.properties

      - name: Release Build
        if: success()
        run: ./gradlew --no-daemon app:assembleMetaRelease

      - name: Tag Repo
        uses: richardsimko/update-tag@v3
        with:
          tag_name: ${{ inputs.release-tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        with:
          tag_name: ${{ inputs.release-tag }}
          files: app/build/outputs/apk/meta/release/*
          generate_release_notes: true

      - name: Release Changelog Builder
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configurationJson: |
            {
              "ignore_labels": [
                "Update"
              ],
            }